name: Build OverWatchMK2 (Windows exe + macOS app)

# Läuft bei jedem Push auf main (reiner Build-/Rauchtest, kein Release)
# UND bei jedem Push eines Versions-Tags (z.B. "v1.0.0") -- dann wird
# zusätzlich ein GitHub Release mit allen fertigen Artefakten angelegt.
# Auch manuell auslösbar über "Run workflow" im Actions-Tab.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # nötig, damit der release-Job ein GitHub Release anlegen darf

jobs:
  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Syntaxprüfung (python3 -m py_compile)
        run: |
          python -m py_compile main.py sms_gateway.py ogn_receiver.py

      - name: PyInstaller Build (OverWatchMK2.exe)
        run: pyinstaller --clean --noconfirm OverWatchMK2.spec

      - name: Release-Paket zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_windows -Force | Out-Null
          Copy-Item dist/OverWatchMK2.exe release_windows/
          Copy-Item config.yaml release_windows/
          Copy-Item README.md release_windows/
          Copy-Item ANLEITUNG.md release_windows/
          Copy-Item CHANGELOG.md release_windows/
          New-Item -ItemType Directory -Path release_windows/offline_map -Force | Out-Null
          New-Item -ItemType File -Path release_windows/offline_map/HIER_MBTILES_DATEI_ABLEGEN.txt -Force | Out-Null

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OverWatchMK2-windows
          path: release_windows/

  build-macos:
    name: macOS .app (Apple Silicon / arm64)
    # WICHTIG (siehe CHANGELOG.md [1.0.2]): NUR "macos-14" (Apple-
    # Silicon/arm64-Runner), bewusst KEIN Intel/x86_64-Build mehr.
    # "macos-13" (der letzte von GitHub bereitgestellte Intel-Runner)
    # wurde von GitHub als gehostetes Runner-Image entfernt -- ein
    # Workflow, der ihn anfordert, hängt dauerhaft bei "Waiting for a
    # runner to pick up this job", da dieses Label schlicht nicht mehr
    # existiert. Da der Nutzer ausschließlich Apple-Silicon-Macs (M1
    # und neuer) unterstützen möchte, entfällt die zuvor eingeführte
    # Intel/arm64-Matrix wieder -- ein einzelner, expliziter
    # arm64-Runner reicht.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Syntaxprüfung (python3 -m py_compile)
        run: |
          python -m py_compile main.py sms_gateway.py ogn_receiver.py

      - name: PyInstaller Build (onefile-Binary)
        run: pyinstaller --clean --noconfirm OverWatchMK2.spec

      - name: .app-Bundle mit Terminal-Startskript bauen
        run: |
          # Siehe CHANGELOG.md [1.0.3] / OverWatchMK2.spec: PyInstallers
          # eigenes BUNDLE() würde ein .app erzeugen, das beim Finder-
          # Doppelklick OHNE sichtbares Fenster/Terminal im Hintergrund
          # läuft -- schwer wieder zu beenden. Stattdessen wird das .app
          # hier von Hand zusammengesetzt: CFBundleExecutable ist ein
          # kleines Start-Skript, das ein sichtbares Terminal-Fenster
          # öffnet und darin das eigentliche Programm ausführt.
          APP="dist_app/OverWatchMK2.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Eigentliches Programm, umbenannt damit es sich klar vom
          # Start-Skript unterscheidet (beide liegen im selben Ordner).
          cp dist/OverWatchMK2 "$APP/Contents/MacOS/OverWatchMK2-bin"
          chmod +x "$APP/Contents/MacOS/OverWatchMK2-bin"

          cat > "$APP/Contents/MacOS/OverWatchMK2" << 'LAUNCHER'
          #!/bin/bash
          # OverWatchMK2 -- Terminal-Startskript (siehe CHANGELOG.md [1.0.3]).
          # Wird beim Doppelklick auf die .app als CFBundleExecutable
          # aufgerufen. Öffnet ein sichtbares Terminal-Fenster und startet
          # darin das eigentliche Programm -- so lässt es sich jederzeit
          # per Strg+C oder Schließen des Fensters wieder beenden, statt
          # nur über die Aktivitätsanzeige.
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          BIN="$DIR/OverWatchMK2-bin"
          osascript <<APPLESCRIPT
          tell application "Terminal"
              activate
              do script "\"$BIN\"; exit"
          end tell
          APPLESCRIPT
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/OverWatchMK2"

          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>OverWatchMK2</string>
              <key>CFBundleDisplayName</key><string>OverWatchMK2</string>
              <key>CFBundleExecutable</key><string>OverWatchMK2</string>
              <key>CFBundleIdentifier</key><string>de.overwatchmk2.app</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0.3</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Ausführungsrechte + Quarantäne-Attribut prüfen
        run: |
          # Sicherstellen, dass beide Binaries in Contents/MacOS/
          # ausführbar sind -- nachfolgende Zip-/Artefakt-Schritte können
          # das Bit unter Umständen verlieren, siehe bekannte Probleme mit
          # actions/upload-artifact und Unix-Rechten. Direkt nach dem
          # Bauen (also VOR jedem Zip-/Upload-Schritt) nochmal explizit
          # setzen, damit es garantiert im Archiv landet.
          chmod +x "dist_app/OverWatchMK2.app/Contents/MacOS/OverWatchMK2"
          chmod +x "dist_app/OverWatchMK2.app/Contents/MacOS/OverWatchMK2-bin"
          ls -la "dist_app/OverWatchMK2.app/Contents/MacOS/"
          file "dist_app/OverWatchMK2.app/Contents/MacOS/OverWatchMK2-bin"
          xattr -cr "dist_app/OverWatchMK2.app" || true

      - name: Release-Paket zusammenstellen
        run: |
          mkdir -p release_macos
          cp -R dist_app/OverWatchMK2.app release_macos/
          cp config.yaml release_macos/
          cp README.md release_macos/
          cp ANLEITUNG.md release_macos/
          cp CHANGELOG.md release_macos/
          mkdir -p release_macos/offline_map
          touch release_macos/offline_map/HIER_MBTILES_DATEI_ABLEGEN.txt
          # macOS-Downloads/Artefakt-Uploads erhalten .app-Bundles nur
          # zuverlässig, wenn sie vorher gezippt werden (sonst gehen
          # Ausführungsrechte/Bundle-Struktur beim Hoch-/Herunterladen
          # verloren) -- "zip -y" erhält zusätzlich Symlinks innerhalb
          # des Bundles unverändert.
          cd release_macos && zip -r -y OverWatchMK2-macOS.zip . -x "OverWatchMK2-macOS.zip"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OverWatchMK2-macos
          path: release_macos/OverWatchMK2-macOS.zip

  release:
    name: GitHub Release erstellen
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OverWatchMK2-windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: OverWatchMK2-macos
          path: artifacts/macos

      - name: Windows-Ordner zippen
        run: |
          cd artifacts/windows
          zip -r ../../OverWatchMK2-windows.zip .

      - name: macOS-Zip an Ort und Stelle benennen
        run: |
          cp artifacts/macos/OverWatchMK2-macOS.zip ./OverWatchMK2-macos.zip

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OverWatchMK2-windows.zip
            OverWatchMK2-macos.zip
          generate_release_notes: true
